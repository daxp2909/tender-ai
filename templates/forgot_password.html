{% extends "base.html" %}
{% block title %}Forgot Password — TenderAI{% endblock %}
{% block meta_description %}Reset your TenderAI password.{% endblock %}

{% block content %}
<div style="max-width:440px;margin:0 auto;padding:64px 24px;">

  <div style="text-align:center;margin-bottom:32px;">
    <div style="font-size:3rem;margin-bottom:12px;">🔐</div>
    <h1 style="font-family:'Sora',sans-serif;font-size:1.5rem;font-weight:800;margin:0 0 8px;">Forgot Password?</h1>
    <p style="color:var(--muted);font-size:0.9rem;">Enter your email and we'll generate a reset link.</p>
  </div>

  <div style="background:var(--white);border-radius:14px;padding:28px 24px;border:1px solid var(--border);">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div style="margin-bottom:18px;">
        <label for="fp-email" style="display:block;font-family:'Sora',sans-serif;font-size:0.8rem;font-weight:700;margin-bottom:6px;">Email Address</label>
        <input id="fp-email" type="email" name="email" required autocomplete="email"
          style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:0.9rem;
                 background:var(--surface);box-sizing:border-box;"
          placeholder="you@company.com">
      </div>

      <button type="submit"
        style="width:100%;padding:13px;background:var(--blue);color:white;border:none;border-radius:11px;
               font-family:'Sora',sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;
               box-shadow:0 3px 14px rgba(30,111,232,0.28);">
        Generate Reset Link
      </button>
    </form>
  </div>

  <div style="text-align:center;margin-top:20px;">
    <a href="/login" style="font-size:0.88rem;color:var(--blue);font-weight:600;text-decoration:none;">← Back to Login</a>
  </div>

</div>
{% endblock %}
