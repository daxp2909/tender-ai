{% extends "base.html" %}
{% block title %}Too Many Requests — TenderAI{% endblock %}

{% block content %}
<div style="max-width:500px;margin:0 auto;padding:80px 24px;text-align:center;">
  <div style="font-size:4rem;margin-bottom:16px;">🕐</div>
  <h1 style="font-family:'Sora',sans-serif;font-size:2rem;font-weight:800;margin:0 0 12px;">Slow Down!</h1>
  <p style="color:var(--muted);font-size:0.95rem;margin-bottom:28px;">
    You've made too many requests. Please wait a minute and try again.
  </p>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
    <a href="/" style="padding:12px 24px;border-radius:9px;font-size:0.88rem;font-weight:700;
       background:var(--blue);color:white;text-decoration:none;">Go Home</a>
    <a href="/contact" style="padding:12px 24px;border-radius:9px;font-size:0.88rem;font-weight:600;
       background:white;color:var(--blue);border:1px solid rgba(30,111,232,0.3);text-decoration:none;">Contact Support</a>
  </div>
</div>
{% endblock %}
